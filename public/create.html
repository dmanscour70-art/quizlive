<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un quiz – QuizLive</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--bg); }
    .create-layout { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
    .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 2rem; }
    .toolbar-left { flex: 1; }
    .quiz-title-input {
      background: none;
      border: none;
      border-bottom: 3px solid rgba(255,255,255,0.15);
      color: var(--text);
      font-size: 1.8rem;
      font-weight: 800;
      padding: 0.25rem 0;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .quiz-title-input:focus { border-color: var(--accent); }
    .quiz-title-input::placeholder { color: var(--text-muted); }

    .add-q-bar { text-align: center; margin-top: 1rem; }
    .time-select-wrap { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; font-size: 0.9rem; color: var(--text-muted); }
    .time-select-wrap select { width: auto; }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 0.875rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 50;
    }
    .q-count { color: var(--text-muted); font-size: 0.9rem; }
    .bottom-actions { display: flex; gap: 0.75rem; }

    .drag-handle { cursor: grab; color: var(--text-muted); font-size: 1.2rem; padding: 0 0.25rem; }

    .answer-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .ans-label-0 { color: var(--ans-0); }
    .ans-label-1 { color: var(--ans-1); }
    .ans-label-2 { color: var(--ans-2); }
    .ans-label-3 { color: var(--ans-3); }

    .correct-mark {
      width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      font-size: 0.9rem;
    }
    .correct-mark.active { background: #2ecc71; border-color: #2ecc71; }

    .preview-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">QuizLive</a>
    <div style="display:flex; gap:0.75rem; align-items:center;">
      <span class="preview-pill" id="saveStatus">✏️ Non sauvegardé</span>
      <button class="btn btn-sm btn-ghost" onclick="window.location='/'">← Retour</button>
    </div>
  </nav>

  <div class="create-layout">
    <div style="margin-bottom: 2rem;">
      <input class="quiz-title-input" id="quizTitle" type="text"
        placeholder="Titre du quiz (ex: Culture générale...)" maxlength="80">
    </div>

    <div id="questionsList"></div>

    <div class="add-q-bar">
      <button class="btn btn-secondary btn-lg" id="addQuestionBtn">
        + Ajouter une question
      </button>
    </div>
  </div>

  <div class="bottom-bar">
    <div>
      <div class="q-count" id="qCount">0 question</div>
    </div>
    <div class="bottom-actions">
      <button class="btn btn-secondary" id="saveBtn">💾 Sauvegarder</button>
      <button class="btn btn-primary" id="launchBtn" disabled>🚀 Lancer une partie</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/create.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique – Mindeon School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { overflow-y: auto; }
    .layout { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .page-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.25rem; }
    .page-sub   { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-icon  { font-size: 4rem; margin-bottom: 1rem; }

    /* Game cards */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .game-card-header {
      padding: 1.1rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .game-card-header:hover { background: var(--bg); }

    .game-mode-badge {
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .mode-solo  { background: rgba(91,75,222,0.1); color: var(--accent); }
    .mode-multi { background: rgba(56,161,105,0.1); color: var(--success); }

    .game-title { font-weight: 700; font-size: 1rem; flex: 1; min-width: 0; }
    .game-date  { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
    .game-score { font-weight: 800; color: var(--accent2); white-space: nowrap; font-size: 1rem; }

    .score-bar-wrap { display: flex; align-items: center; gap: 0.75rem; padding: 0 1.4rem 1rem; }
    .score-pct { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; font-weight: 600; }

    .chevron { color: var(--text-muted); font-size: 1rem; transition: transform 0.2s; flex-shrink: 0; }
    .chevron.open { transform: rotate(90deg); }

    /* Question detail */
    .game-detail {
      border-top: 1px solid var(--border);
      padding: 1rem 1.4rem 1.4rem;
      display: none;
    }
    .game-detail.open { display: block; }

    .detail-stats {
      display: flex; gap: 1rem; flex-wrap: wrap;
      margin-bottom: 1.1rem;
    }
    .dstat {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .dstat strong { font-size: 1.1rem; }
    .dstat.green strong { color: var(--success); }
    .dstat.red   strong { color: var(--danger); }

    .q-detail-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .q-detail-item {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.88rem;
    }
    .qd-icon  { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.1rem; }
    .qd-body  { flex: 1; min-width: 0; }
    .qd-text  { font-weight: 600; line-height: 1.4; }
    .qd-ans   { color: var(--text-muted); font-size: 0.82rem; margin-top: 0.2rem; }
    .qd-pts   { font-weight: 800; color: var(--accent2); white-space: nowrap; font-size: 0.9rem; }

    /* Multiplayer leaderboard detail */
    .multi-lb { margin-top: 0.75rem; }
    .multi-lb-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      margin-bottom: 0.3rem;
    }
    .multi-lb-row:nth-child(1) { background: rgba(246,173,85,0.15); }
    .multi-lb-row:nth-child(2) { background: rgba(160,174,192,0.15); }
    .multi-lb-row:nth-child(3) { background: rgba(192,86,33,0.1); }
    .multi-lb-row:nth-child(n+4) { background: var(--bg); }
    .mlb-rank { width: 1.5rem; text-align: center; font-size: 1.1rem; }
    .mlb-name { flex: 1; font-weight: 600; }
    .mlb-score { font-weight: 800; color: var(--accent2); }

    .clear-btn { color: var(--danger); font-size: 0.82rem; }

    @media (max-width: 520px) {
      .game-date { display: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">Mindeon School</a>
    <a href="/" class="btn btn-ghost btn-sm">← Accueil</a>
  </nav>

  <div class="layout">
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:0.5rem;">
      <div>
        <div class="page-title">📋 Historique</div>
        <div class="page-sub">Vos parties solo et multijoueur</div>
      </div>
      <button class="btn btn-ghost btn-sm clear-btn" id="clearBtn">🗑 Tout effacer</button>
    </div>

    <div id="historyContainer"></div>
  </div>

  <script>
    const STORAGE_KEY = 'mindeon_history';

    function loadHistory() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diffH = (now - d) / 3600000;
      if (diffH < 1)   return 'Il y a moins d\'1h';
      if (diffH < 24)  return `Il y a ${Math.floor(diffH)}h`;
      if (diffH < 48)  return 'Hier';
      return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderHistory() {
      const history = loadHistory();
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      if (!history.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p style="font-weight:700; font-size:1.1rem;">Aucune partie enregistrée</p>
            <p style="margin-top:0.5rem; font-size:0.9rem;">Jouez un quiz en solo ou multijoueur pour voir votre historique ici.</p>
            <a href="/" class="btn btn-primary" style="margin-top:1.5rem;">Jouer maintenant</a>
          </div>
        `;
        return;
      }

      // Most recent first
      [...history].reverse().forEach((game, idx) => {
        const card = document.createElement('div');
        card.className = 'game-card';

        const isSolo    = game.mode === 'solo';
        const correct   = game.correct ?? 0;
        const total     = game.total ?? 1;
        const pct       = Math.round((correct / total) * 100);
        const medals    = ['🥇','🥈','🥉'];
        const modeLabel = isSolo ? '🎮 Solo' : '👥 Multi';
        const modeCls   = isSolo ? 'mode-solo' : 'mode-multi';

        card.innerHTML = `
          <div class="game-card-header" data-idx="${idx}">
            <span class="game-mode-badge ${modeCls}">${modeLabel}</span>
            <div class="game-title">${esc(game.quizTitle)}</div>
            <div class="game-date">${formatDate(game.date)}</div>
            <div class="game-score">${(game.score||0).toLocaleString()} pts</div>
            <div class="chevron" data-chev="${idx}">›</div>
          </div>
          <div style="padding: 0 1.4rem 0.875rem;">
            <div class="score-bar-wrap" style="padding:0;">
              <div class="progress-bar" style="flex:1;">
                <div class="progress-fill" style="width:${pct}%;"></div>
              </div>
              <div class="score-pct">${correct}/${total} (${pct}%)</div>
            </div>
          </div>
          <div class="game-detail" id="detail-${idx}">
            ${renderDetail(game, medals)}
          </div>
        `;

        card.querySelector('.game-card-header').addEventListener('click', () => {
          const detail = document.getElementById(`detail-${idx}`);
          const chev   = card.querySelector(`[data-chev="${idx}"]`);
          const open   = detail.classList.toggle('open');
          chev.classList.toggle('open', open);
        });

        container.appendChild(card);
      });
    }

    function renderDetail(game, medals) {
      const correct = game.correct ?? 0;
      const total   = game.total ?? 1;
      const wrong   = total - correct;

      let html = `
        <div class="detail-stats">
          <div class="dstat green"><strong>${correct}</strong> bonnes réponses</div>
          <div class="dstat red"><strong>${wrong}</strong> mauvaises réponses</div>
          <div class="dstat"><strong>${(game.score||0).toLocaleString()}</strong> points</div>
        </div>
      `;

      // Solo: question-by-question
      if (game.mode === 'solo' && game.questions?.length) {
        html += '<div class="q-detail-list">';
        game.questions.forEach((q, i) => {
          html += `
            <div class="q-detail-item">
              <div class="qd-icon">${q.isCorrect ? '✅' : '❌'}</div>
              <div class="qd-body">
                <div class="qd-text">${esc(q.text)}</div>
                <div class="qd-ans">
                  ${q.isCorrect
                    ? `✓ <strong>${esc(q.correct)}</strong>`
                    : `Votre réponse : ${q.yourAnswer ? `<s>${esc(q.yourAnswer)}</s>` : 'Pas de réponse'} — Bonne réponse : <strong>${esc(q.correct)}</strong>`
                  }
                </div>
              </div>
              ${q.pts ? `<div class="qd-pts">+${q.pts.toLocaleString()}</div>` : ''}
            </div>
          `;
        });
        html += '</div>';
      }

      // Multiplayer: leaderboard
      if (game.mode === 'multi' && game.leaderboard?.length) {
        html += '<div class="multi-lb">';
        game.leaderboard.forEach((p, i) => {
          html += `
            <div class="multi-lb-row">
              <div class="mlb-rank">${medals[i] || (i+1)}</div>
              <div class="mlb-name">${esc(p.name)}</div>
              <div class="mlb-score">${p.score.toLocaleString()} pts</div>
            </div>
          `;
        });
        html += '</div>';
      }

      return html;
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm('Effacer tout l\'historique ?')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    });

    renderHistory();
  </script>
</body>
</html>
